server:
  port: ${PORT:3000}
  forward-headers-strategy: framework

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:reddot_website}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:reddot_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    default-property-inclusion: non_null

app:
  web-root: ${WEB_ROOT:..}
  seed-file: ${SEED_FILE:../data/site.json}
  admin:
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}

logging:
  level:
    root: INFO
    com.reddotchip: INFO
